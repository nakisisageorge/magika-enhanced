[project]
name = "magika-enhanced"
description = "Enhanced AI-powered file type detection with async API, custom rules engine, and MCP server integration"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "George Nakisisa", email = "nakisisageorge@gmail.com"},
    {name = "Magika Developers", email = "magika-dev@google.com"},
]
maintainers = [
    {name = "George Nakisisa", email = "nakisisageorge@gmail.com"},
]
keywords = [
    "content-type-detection", "machine-learning", "file-identification",
    "mime-types", "ai", "async", "mcp", "custom-rules",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.8"
dependencies = [
    "magika>=2.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0",
    "tqdm>=4.66",
]
optional-dependencies = {mcp = ["mcp>=1.0.0", "httpx>=0.27", "uvicorn>=0.30"], benchmarks = ["pytest-benchmark>=4.0", "memory-profiler>=0.61", "psutil>=5.9", "python-magic>=0.4.27", "puremagic>=1.15"], dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "pytest-xdist>=3.5", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "bandit>=1.7", "safety>=3.0", "pre-commit>=3.7", "tox>=4.0"], docs = ["sphinx>=7.3", "sphinx-rtd-theme>=2.0", "myst-parser>=2.0"]}

[project.urls]
Homepage = "https://github.com/nakisisageorge/magika-enhanced"
Repository = "https://github.com/nakisisageorge/magika-enhanced"
Issues = "https://github.com/nakisisageorge/magika-enhanced/issues"
Documentation = "https://nakisisageorge.github.io/magika-enhanced/"
Changelog = "https://github.com/nakisisageorge/magika-enhanced/blob/main/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.6", "setuptools>=68"]
build-backend = "maturin"

[tool.maturin]
module-name = "magika_enhanced._core"
bindings = "pyo3"
compatibility = "off"
skip-auditwheel = false
manylinux = "manylinux_2_28"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py38"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "T20", "PTH", "SIM", "RET", "FLY", "PD", "PGH", "PL", "TRY", "NPY", "RSE", "ARG", "PERF", "FA", "ISC", "ICN", "PIE", "TCH", "INT", "ASYNC", "LOG", "ERA"]
ignore = ["S101", "S311", "ARG001", "ARG002"]
per-file-ignores = {tests/* = ["S101", "S311"], scripts/* = ["S101", "S311", "T201"]}
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
[[tool.mypy.overrides]]
module = "magika*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["magika_enhanced"]
omit = ["tests/*", "scripts/*", "*/__pycache__/*"]
[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if __name__ == .__main__.: "]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "scripts", "docs"]
skips = ["B101", "B108"]

[tool.safety]
ignore = []
key = ""

[tool.setuptools.packages.find]
where = ["."]
include = ["magika_enhanced*"]
